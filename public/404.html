<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Production Monitoring Dashboard</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Converts 404 path into hash route and redirects to base
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoName = l.pathname.split('/')[1] || '';
      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var query = l.search ? l.search.slice(1) : '';
      var hash = l.hash ? l.hash.slice(1) : '';
      
      // Redirect to base URL with hash route
      var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + repoName + '/#' + (path ? '/' + path : '/dashboard') + (query ? '?' + query : '');
      l.replace(target);
    </script>
  </head>
  <body>
    <p>Redirecting to Production Monitoring Dashboard...</p>
  </body>
</html>
